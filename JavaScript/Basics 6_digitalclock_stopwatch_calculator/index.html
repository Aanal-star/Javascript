<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- digital clock -->
    <div id="clock-container">
        <div id="clock">00:00:00</div>
    </div>
    <!-- stopwatch -->
    <h1 id="myH1">Stopwatch</h1>
    <div id="container">
        <div id="display">00:00:00:00</div>
        <div id="controls">
            <button id="startbtn" onclick="start()">Start</button>
            <button id="stopbtn" onclick="stop()">Stop</button>
            <button id="resetbtn" onclick="reset()">Reset</button>
        </div>
    </div>
    <!-- calculator -->
    <div id="calculator">
        <input id="displays" readonly>
        <div id="keys">
            <button onclick="appendToDisplay('+')" id="cal">+</button>
            <button onclick="appendToDisplay('7')" id="cal">7</button>
            <button onclick="appendToDisplay('8')"id="cal">8</button>
            <button onclick="appendToDisplay('9')"id="cal">9</button>
            <button onclick="appendToDisplay('-')"id="cal">-</button>
            <button onclick="appendToDisplay('4')"id="cal">4</button>
            <button onclick="appendToDisplay('5')"id="cal">5</button>
            <button onclick="appendToDisplay('6')"id="cal">6</button>
            <button onclick="appendToDisplay('*')"id="cal">*</button>
            <button onclick="appendToDisplay('1')"id="cal">1</button>
            <button onclick="appendToDisplay('2')"id="cal">2</button>
            <button onclick="appendToDisplay('3')"id="cal">3</button>
            <button onclick="appendToDisplay('/')"id="cal">/</button>
            <button onclick="appendToDisplay('0')"id="cal">0</button>
            <button onclick="appendToDisplay('.')"id="cal">.</button>
            <button onclick="calculator()"id="cal">=</button>
            <button onclick="clearDisplay()"id="cal">C</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
